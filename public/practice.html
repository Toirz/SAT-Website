<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>SigmaSAT – Luyện đề</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <aside class="sidebar">
    <a href="index.html" class="sigma-logo-top">
      <img src="/images/logo.png" alt="SigmaSAT logo" class="sigma-logo-img" />
      <span class="sigma-logo-text">SigmaSAT</span>
    </a>

    <nav class="sidebar-nav">
      <a href="index.html" class="sidebar-item"><img src="/images/home.png" class="sidebar-icon" alt="home"> Trang chủ</a>
      <div class="sidebar-item collapsible" id="practice-toggle">
        <span><img src="/images/luyende.png" class="sidebar-icon" alt="luyende"> Luyện đề</span>
        <span class="chevron"><img src="/images/down.png" class="sidebar-chevron" alt="open"></span>
      </div>
      <div class="sidebar-submenu" id="practice-submenu">
        <a
          href="practice.html?category=real_tests"
          class="sidebar-subitem"
          data-category="real_tests"
        >Đề thi thật</a>
        <a
          href="practice.html?category=practice_tests"
          class="sidebar-subitem"
          data-category="practice_tests"
        >Đề luyện</a>
      </div>
      
    </nav>

    <div class="sidebar-footer">
      <div class="account-status" id="account-status">
        <span class="status-dot"></span>
        <span class="status-text">Đang tải trạng thái…</span>
      </div>
      <a href="/logout" class="logout-bottom">Đăng xuất</a>
    </div>
  </aside>

  <main class="main-content">
    <h2 class="page-title">Luyện đề</h2>

    <div class="search-filter">
      <div class="search-input" id="date-filter">
        <input
          type="text"
          id="filter-display"
          placeholder="Chọn tháng/năm đề thi thật"
          readonly
        />
        <span class="search-caret">▾</span>
      </div>
      <div class="search-options" id="filter-options"></div>
    </div>

    <div id="test-list">Loading tests...</div>
    
  </main>

<div class="plan-modal-backdrop" id="plan-modal">
    <div class="plan-modal">
      <button class="plan-close" id="plan-close" aria-label="Đóng">
        ×
      </button>
      <div class="plan-header">
        <div class="plan-title">Nâng cấp gói</div>
        <div class="plan-subtitle">Trải nghiệm đầy đủ với gói 1 tháng</div>
      </div>
      <div class="plan-showcase">
        <div class="plan-showcase-card">
          <div class="plan-showcase-text">
            <div class="plan-option-title">Đăng kí 1 tháng</div>
            <div class="plan-option-desc">Mở khoá toàn bộ tính năng trong 30 ngày</div>
            <div class="plan-price">67.000đ</div>
          </div>
          <div class="plan-preview">
            <img src="/images/preview.png" alt="Xem trước gói 1 tháng" class="plan-preview-image" />
          </div>
        </div>
      </div>
      <button class="upgrade-btn" id="upgrade-btn">Nâng cấp ngay</button>
    </div>
  </div>

  <script>

  const accountStatus = document.getElementById("account-status");
  const planModal = document.getElementById("plan-modal");
  const closePlanBtn = document.getElementById("plan-close");
  const upgradeBtn = document.getElementById("upgrade-btn");
  let isProAccount = false;

  function openPlanModal() {
    if (!planModal) return;
    planModal.classList.add("open");
    document.body.classList.add("modal-open");
  }

  function closePlanModal() {
    if (!planModal) return;
    planModal.classList.remove("open");
    document.body.classList.remove("modal-open");
  }

  function getSelectedPlan() {
    return "month";
  }

  if (planModal) {
    planModal.addEventListener("click", (event) => {
      if (event.target === planModal) closePlanModal();
    });
  }

  if (closePlanBtn) {
    closePlanBtn.addEventListener("click", closePlanModal);
  }

  if (upgradeBtn) {
    upgradeBtn.addEventListener("click", () => {
      const plan = getSelectedPlan();
      window.location.href = `/payment.html?plan=${plan}`;
    });
  }

  const params = new URLSearchParams(window.location.search);
  const category = params.get("category") || "real_tests";

  const categoryMap = {
    real_tests: "Đề thi thật",
    practice_tests: "Đề luyện",
  };

  const pageTitle = document.querySelector(".page-title");
  if (pageTitle) {
    pageTitle.textContent = `${categoryMap[category] || "Luyện đề"}`;
  }

  const submenu = document.getElementById("practice-submenu");
  const toggle = document.getElementById("practice-toggle");
  const chevron = toggle?.querySelector(".chevron");

  function setSubmenu(open) {
    if (!submenu || !toggle) return;
    submenu.classList.toggle("open", open);
    toggle.classList.toggle("active", open);
    if (chevron) {
      const img = chevron.querySelector('img');
      if (img) img.src = open ? '/images/up.png' : '/images/down.png';
    }
  }

  if (toggle) {
    toggle.addEventListener("click", () => setSubmenu(!submenu?.classList.contains("open")));
  }

  setSubmenu(true);
  document
    .querySelectorAll(`.sidebar-subitem[data-category="${category}"]`)
    .forEach((item) => item.classList.add("active"));

  async function checkState(fullName) {
    try {
      const res = await fetch(`/api/test-state?file=${encodeURIComponent(fullName)}`);
      const data = await res.json();
      return data && data.hasData === true;
    } catch (e) {
      return false;
    }
  }

  function renderLockedMessage(message) {
    const list = document.getElementById("test-list");
    if (list) {
      list.innerHTML = `<div class="pro-locked">${message}</div>`;
    }
  }

  const filterDisplay = document.getElementById("filter-display");
  const filterOptions = document.getElementById("filter-options");
  const filterPlaceholder = category === "practice_tests"
    ? "Chọn dạng bài luyện tập"
    : "Chọn tháng/năm đề thi thật";
  if (filterDisplay) {
    filterDisplay.placeholder = filterPlaceholder;
  }

  const monthNames = [
    "january",
    "february",
    "march",
    "april",
    "may",
    "june",
    "july",
    "august",
    "september",
    "october",
    "november",
    "december",
  ];

  let filterKeyword = "";
  let cachedTests = [];
  let searchEventsBound = false;

  function extractMonthYear(name = "") {
    const match = name.match(/^SAT\s+([A-Za-z]+\s+\d{4})/i);
    return match ? match[1] : null;
  }

  function monthYearToSortable(value = "") {
    const parts = value.trim().split(/\s+/);
    if (parts.length !== 2) return null;

    const [monthName, yearStr] = parts;
    const year = parseInt(yearStr, 10);
    const monthIndex = monthNames.indexOf(monthName.toLowerCase());

    if (Number.isNaN(year) || monthIndex === -1) return null;

    return { year, monthIndex };
  }

  function getPracticeType(name = "") {
    const [type] = name.split("-");
    return type ? type.trim() : "";
  }

  function toggleOptions(forceState) {
    const inputWrapper = document.getElementById("date-filter");
    if (!filterOptions || !inputWrapper) return;

    const isOpen =
      typeof forceState === "boolean"
        ? forceState
        : !filterOptions.classList.contains("open");

    filterOptions.classList.toggle("open", isOpen);
    inputWrapper.classList.toggle("active", isOpen);
  }

  function attachSearchEvents() {
    if (searchEventsBound) return;
    const inputWrapper = document.getElementById("date-filter");
    if (!inputWrapper || !filterOptions) return;

    inputWrapper.addEventListener("click", () => toggleOptions());

    document.addEventListener("click", (e) => {
      if (!inputWrapper.contains(e.target) && !filterOptions.contains(e.target)) {
        toggleOptions(false);
      }
    });

    searchEventsBound = true;
  }

  function buildRealFilterOptions(realTests = []) {
    if (!filterOptions || !filterDisplay) return;

    const options = Array.from(
      new Set(
        realTests
          .map((name) => extractMonthYear(name))
          .filter(Boolean)
      )
    ).sort((a, b) => {
      const aParts = monthYearToSortable(a);
      const bParts = monthYearToSortable(b);

      if (!aParts || !bParts) return 0;

      if (aParts.year !== bParts.year) return bParts.year - aParts.year;
      return bParts.monthIndex - aParts.monthIndex;
    });

    filterOptions.innerHTML = "";

    const allBtn = document.createElement("button");
    allBtn.className = "option-item";
    allBtn.textContent = "Tất cả đề";
    allBtn.addEventListener("click", () => {
      filterKeyword = "";
      filterDisplay.value = "";
      toggleOptions(false);
      renderTests();
    });
    filterOptions.appendChild(allBtn);

    options.forEach((opt) => {
      const btn = document.createElement("button");
      btn.className = "option-item";
      btn.textContent = opt;
      btn.addEventListener("click", () => {
        filterKeyword = opt;
        filterDisplay.value = opt;
        toggleOptions(false);
        renderTests();
      });
      filterOptions.appendChild(btn);
    });
  }

  function buildPracticeFilterOptions(practiceTests = []) {
    if (!filterOptions || !filterDisplay) return;

    const types = Array.from(
      new Set(practiceTests.map((name) => getPracticeType(name)).filter(Boolean))
    ).sort((a, b) => a.localeCompare(b));

    filterOptions.innerHTML = "";

    const allBtn = document.createElement("button");
    allBtn.className = "option-item";
    allBtn.textContent = "Tất cả dạng bài";
    allBtn.addEventListener("click", () => {
      filterKeyword = "";
      filterDisplay.value = "";
      toggleOptions(false);
      renderTests();
    });
    filterOptions.appendChild(allBtn);

   types.forEach((type) => {
      const btn = document.createElement("button");
      btn.className = "option-item";
      btn.textContent = type;
      btn.addEventListener("click", () => {
        filterKeyword = type;
        filterDisplay.value = type;
        toggleOptions(false);
        renderTests();
      });
      filterOptions.appendChild(btn);
    });
  }

  function renderRealTests(tests = []) {
    const list = document.getElementById("test-list");
    if (!list) return;

      list.innerHTML = "";

      const filteredTests = filterKeyword
      ? tests.filter((name) => name.toLowerCase().includes(filterKeyword.toLowerCase()))
      : tests;

      const groups = {};

    if (filteredTests.length === 0) {
      const noDataMessage = filterKeyword
        ? `Không tìm thấy đề với từ khóa "${filterKeyword}".`
        : "Chưa có đề trong mục này.";
      list.innerHTML = `<p class='empty-tests'>${noDataMessage}</p>`;
      return;
    }

    filteredTests.forEach((name) => {
      const prefix = name.replace(/ - Mod \d+$/, "");
      if (!groups[prefix]) groups[prefix] = [];
      groups[prefix].push(name);
    });

    Object.keys(groups).forEach((testName) => {
      const groupBox = document.createElement("div");
      groupBox.className = "test-group";

      groupBox.innerHTML = `
          <div class="group-title">${testName}</div>
          <div class="group-grid"></div>
        `;

      const grid = groupBox.querySelector(".group-grid");

      groups[testName].forEach((fullName) => {
        const mod = fullName.match(/Mod (\d+)/)?.[1] || "?";
        const filePath = `${category}/${fullName}`;

        const card = document.createElement("div");
        card.className = "test-card";

        card.innerHTML = `
              <div class="test-header">
                Module ${mod}
                <span class="status-badge status-black">Chưa làm bài</span>
              </div>

              <div class="test-meta">
                <!-- meta area reserved for extra info if needed -->
              </div>

            <div class="test-actions">
              <button class="btn start-btn">Start</button>
              <button class="btn history-btn">Xem lại</button>
            </div>
          `;

        const startBtn = card.querySelector(".start-btn");
        const statusBadge = card.querySelector(".status-badge");

        /* Kiểm tra đang làm dở */
        checkState(filePath).then((inProgress) => {
          if (inProgress) {
            startBtn.textContent = "Tiếp tục";
            startBtn.classList.remove("start-btn");
            startBtn.classList.add("continue-btn");
          } else {
            startBtn.textContent = "Bắt đầu";
            startBtn.classList.remove("continue-btn");
            startBtn.classList.add("start-btn");
          }
        });

        /* Kiểm tra đã hoàn thành từ DB */
        fetch(`/api/test-completed?file=${encodeURIComponent(filePath)}`)
          .then((res) => res.json())
          .then((data) => {
            if (!statusBadge) return;

            const score = typeof data.lastScore === "number" ? data.lastScore : null;
            const total = typeof data.lastTotal === "number" ? data.lastTotal : null;

            // Reset classes
            statusBadge.className = "status-badge";

            if (score === null) {
              // Not attempted
              statusBadge.textContent = "Chưa làm bài";
              statusBadge.classList.add("status-black");
            } else {
              statusBadge.textContent = `${score}/${total}`;

              if (score === total && total > 0) {
                statusBadge.classList.add("status-rainbow");
              } else if (score <= 15) {
                statusBadge.classList.add("status-red");
              } else if (score <= 21) {
                statusBadge.classList.add("status-yellow");
              } else if (score <= 26) {
                statusBadge.classList.add("status-green");
              } else {
                statusBadge.classList.add("status-green");
              }
            }
          });

        startBtn.onclick = () =>
          window.location.href = "test.html?file=" + encodeURIComponent(filePath);

        card.querySelector(".history-btn").onclick = () =>
          window.location.href = "history.html?file=" + encodeURIComponent(filePath);

        grid.appendChild(card);
      });

      list.appendChild(groupBox);
    });
  }

  function renderPracticeTests(tests = []) {
    const list = document.getElementById("test-list");
    if (!list) return;

    list.innerHTML = "";

    const filteredTests = filterKeyword
      ? tests.filter((name) => name.toLowerCase().includes(filterKeyword.toLowerCase()))
      : tests;

    if (filteredTests.length === 0) {
      const noDataMessage = filterKeyword
        ? `Không tìm thấy đề với từ khóa "${filterKeyword}".`
        : "Chưa có đề trong mục này.";
      list.innerHTML = `<p class='empty-tests'>${noDataMessage}</p>`;
      return;
    }

    const groups = {};
    filteredTests.forEach((name) => {
      const type = getPracticeType(name) || "Dạng khác";
      if (!groups[type]) groups[type] = [];
      groups[type].push(name);
    });

    Object.keys(groups)
      .sort((a, b) => a.localeCompare(b))
      .forEach((type) => {
        const groupBox = document.createElement("div");
        groupBox.className = "test-group";

        groupBox.innerHTML = `
          <div class="group-title">${type}</div>
          <div class="group-grid"></div>
        `;

        const grid = groupBox.querySelector(".group-grid");

        groups[type]
          .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))
          .forEach((testName) => {
            const filePath = `${category}/${testName}`;
            const card = document.createElement("div");
            card.className = "test-card";

            card.innerHTML = `
              <div class="test-header">
                ${testName}
                <span class="status-badge status-black">Chưa làm bài</span>
              </div>

              <div class="test-actions">
                <button class="btn start-btn">Start</button>
                <button class="btn history-btn">Xem lại</button>
              </div>
            `;

            const startBtn = card.querySelector(".start-btn");
            const statusBadge = card.querySelector(".status-badge");

            checkState(filePath).then((inProgress) => {
              if (inProgress) {
                startBtn.textContent = "Tiếp tục";
                startBtn.classList.remove("start-btn");
                startBtn.classList.add("continue-btn");
              } else {
                startBtn.textContent = "Bắt đầu";
                startBtn.classList.remove("continue-btn");
                startBtn.classList.add("start-btn");
              }
            });

            fetch(`/api/test-completed?file=${encodeURIComponent(filePath)}`)
              .then((res) => res.json())
              .then((data) => {
                if (!statusBadge) return;

                const score = typeof data.lastScore === "number" ? data.lastScore : null;
                const total = typeof data.lastTotal === "number" ? data.lastTotal : null;

                statusBadge.className = "status-badge";

                if (score === null) {
                  statusBadge.textContent = "Chưa làm bài";
                  statusBadge.classList.add("status-black");
                } else {
                  statusBadge.textContent = `${score}/${total}`;

                  if (score === total && total > 0) {
                    statusBadge.classList.add("status-rainbow");
                  } else if (score <= 15) {
                    statusBadge.classList.add("status-red");
                  } else if (score <= 21) {
                    statusBadge.classList.add("status-yellow");
                  } else {
                    statusBadge.classList.add("status-green");
                  }
                }
              });

            startBtn.onclick = () =>
              window.location.href = "test.html?file=" + encodeURIComponent(filePath);

            card.querySelector(".history-btn").onclick = () =>
              window.location.href = "history.html?file=" + encodeURIComponent(filePath);

            grid.appendChild(card);
          });

        list.appendChild(groupBox);
      });
  }

  function renderTests() {
    if (category === "practice_tests") {
      renderPracticeTests(cachedTests);
    } else {
      renderRealTests(cachedTests);
    }
  }

  async function loadTests() {
    try {
      const res = await fetch(`/api/tests?category=${category}`);
      if (res.status === 403) {
        const data = await res.json().catch(() => ({}));
        renderLockedMessage(data.error || "Bạn không có quyền xem mục này.");
        return;
      }

      const data = await res.json();
      cachedTests = data.tests || [];

      if (category === "practice_tests") {
        buildPracticeFilterOptions(cachedTests);
      } else {
        buildRealFilterOptions(cachedTests);
      }

      attachSearchEvents();
      renderTests();
    } catch (e) {
      console.error(e);
      document.getElementById("test-list").innerHTML =
        "<p>Error loading tests.</p>";
    }
  }

  async function initPracticePage() {
    loadTests();
  }

  initPracticePage();
</script>

<script>
  async function loadAccountStatus() {
    const el = document.getElementById("account-status");
    if (!el) return;

    const dot = el.querySelector(".status-dot");
    const text = el.querySelector(".status-text");

    const setState = (isPro) => {
      isProAccount = !!isPro;
      const isClickable = !isProAccount;
      el.classList.toggle("pro", isProAccount);
      if (dot) dot.classList.toggle("pro", !!isPro);
      if (text) text.textContent = isPro ? "Tài khoản Pro" : "Tài khoản thường";
      el.classList.toggle("clickable", isClickable);
    };

    try {
      const res = await fetch("/api/me");
      if (!res.ok) throw new Error("Session not available");
      const me = await res.json();
      setState(!!me?.isPro);
    } catch (err) {
      if (text) text.textContent = "Không lấy được trạng thái";
      el.classList.remove("clickable");
      console.error("Không thể lấy trạng thái tài khoản", err);
    }
  }

  if (accountStatus) {
    accountStatus.addEventListener("click", () => {
      if (!isProAccount) openPlanModal();
    });
  }
  
  loadAccountStatus();
</script>

</body>
</html>
