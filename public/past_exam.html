<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>SigmaSAT – Review Attempt</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="past_exam.css" />
</head>

<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <a href="index.html" class="sigma-logo-top">SigmaSAT</a>

    <nav class="sidebar-nav">
      <a href="index.html" class="sidebar-item"><img src="/images/home.png" class="sidebar-icon" alt="home"> Trang chủ</a>
      <div class="sidebar-item collapsible" id="practice-toggle">
        <span><img src="/images/luyende.png" class="sidebar-icon" alt="luyende"> Luyện đề</span>
        <span class="chevron"><img src="/images/down.png" class="sidebar-chevron" alt="open"></span>
      </div>
      <div class="sidebar-submenu" id="practice-submenu">
        <a
          href="practice.html?category=real_tests"
          class="sidebar-subitem"
          data-category="real_tests"
        >Đề thi thật</a>
        <a
          href="practice.html?category=practice_tests"
          class="sidebar-subitem"
          data-category="practice_tests"
        >Đề luyện</a>
      </div>
      
    </nav>

    <div class="sidebar-footer">
      <div class="account-status" id="account-status">
        <span class="status-dot"></span>
        <span class="status-text">Đang tải trạng thái…</span>
      </div>
      <a href="/logout" class="logout-bottom">Đăng xuất</a>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">

    <div class="attempt-info-card">
      <div class="attempt-info-left">
        <h2 class="attempt-title" id="attempt-test-name">SAT December 2024 – Module 1</h2>

        <div class="attempt-meta">
          <span id="attempt-correct" class="meta-item">Correct: -- / 27</span>
        </div>
      </div>
    </div>

    <!-- SUMMARY TABLE -->
    <table id="past-exam-table">
      <thead>
        <tr>
          <th class="col-no">No</th>
          <th>Question</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="summary-body"></tbody>
    </table>

  </main>

  <script>
    (function initPracticeMenu() {
      const submenu = document.getElementById("practice-submenu");
      const toggle = document.getElementById("practice-toggle");
      const chevron = toggle?.querySelector(".chevron");
      const params = new URLSearchParams(window.location.search);
      const file = params.get("file");
      const categoryFromFile = file?.split("/")[0];

      function setOpen(open) {
        if (!submenu || !toggle) return;
        submenu.classList.toggle("open", open);
        toggle.classList.toggle("active", open);
        if (chevron) {
          const img = chevron.querySelector('img');
          if (img) img.src = open ? '/images/up.png' : '/images/down.png';
        }
      }

      if (toggle) {
        toggle.addEventListener("click", () => setOpen(!submenu?.classList.contains("open")));
      }

      setOpen(Boolean(categoryFromFile));
      if (categoryFromFile) {
        document
          .querySelectorAll(`.sidebar-subitem[data-category="${categoryFromFile}"]`)
          .forEach((item) => item.classList.add("active"));
      }
    })();
  </script>
  
  <!-- POPUP -->
  <div id="review-overlay" class="review-overlay hidden">
    <div class="review-main-panel">

      <header class="past-header">
        <h2 id="past-title" class="past-title-text"></h2>

        <div class="past-controls">
          <span id="position-text"></span>
          <button id="prev-btn" class="nav-btn">‹</button>
          <button id="next-btn" class="nav-btn">›</button>
          <button id="close-overlay" class="close-btn">✕</button>
        </div>
      </header>

      <div id="question-image-wrapper" class="question-image-wrapper hidden">
        <img id="question-image" class="question-image" />
      </div>

      <div class="past-main">
        <div id="question-text" class="question-text"></div>
        <div id="choices" class="choices"></div>
        <p id="summary-text" class="summary-text"></p>
      </div>

    </div>
  </div>

  <script src="past_exam.js"></script>

  <script>
  async function loadAccountStatus() {
    const el = document.getElementById("account-status");
    if (!el) return;

    const dot = el.querySelector(".status-dot");
    const text = el.querySelector(".status-text");

    const setState = (isPro) => {
      el.classList.toggle("pro", !!isPro);
      if (dot) dot.classList.toggle("pro", !!isPro);
      if (text) text.textContent = isPro ? "Tài khoản Pro" : "Tài khoản thường";
    };

    try {
      const res = await fetch("/api/me");
      if (!res.ok) throw new Error("Session not available");
      const me = await res.json();
      setState(!!me?.isPro);
    } catch (err) {
      if (text) text.textContent = "Không lấy được trạng thái";
      console.error("Không thể lấy trạng thái tài khoản", err);
    }
  }

  loadAccountStatus();
</script>

</body>
</html>
