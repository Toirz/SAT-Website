<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>SigmaSAT – Trang chủ</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <a href="index.html" class="sigma-logo-top">SigmaSAT</a>

    <nav class="sidebar-nav">
      <a href="index.html" class="sidebar-item active">🏠 Trang chủ</a>
      <div class="sidebar-item collapsible" id="practice-toggle">
        <span>📝 Luyện đề</span>
        <span class="chevron">⌄</span>
      </div>
      <div class="sidebar-submenu" id="practice-submenu">
        <a
          href="practice.html?category=real_tests"
          class="sidebar-subitem"
          data-category="real_tests"
        >Đề thi thật</a>
        <a
          href="practice.html?category=practice_tests"
          class="sidebar-subitem"
          data-category="practice_tests"
        >Đề luyện</a>
      </div>
      <a class="sidebar-item">⚙️ Cài đặt</a>
    </nav>

    <div class="sidebar-footer">
      <div class="account-status" id="account-status">
        <span class="status-dot"></span>
        <span class="status-text">Đang tải trạng thái…</span>
      </div>
      <a href="/logout" class="logout-bottom">Đăng xuất</a>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main-content">
    <h2 class="page-title">Trang chủ</h2>

    <!-- ▼▼▼ HEATMAP START ▼▼▼ -->
     <div id="motivate" style="font-size:18px; font-weight:600; margin-bottom:15px; color:#0f172a;">
  <!-- message sẽ được JS tự fill -->
</div>

    <div id="heatmap"></div>

    <div class="stats-box">
      <div><b id="total-all">0</b> tổng</div>
      <div><b id="total-year">0</b> năm nay</div>
      <div><b id="total-month">0</b> tháng này</div>
      <div><b id="streak">0</b> streak</div>
      <div><b id="max-streak">0</b> streak max</div>
    </div>
    <!-- ▲▲▲ HEATMAP END ▲▲▲ -->

  </main>

  <!-- ▼▼▼ HEATMAP JS (đã sửa phần tính toán text) ▼▼▼ -->
<script>
async function loadHeatmap() {
  // LUÔN LẤY DATA MỚI, KHÔNG CACHE
  const res = await fetch("/api/heatmap?ts=" + Date.now(), {
    cache: "no-store"
  });
  const data = await res.json();

  const map = {};
  (data.activity || []).forEach(row => {
    // row.date dạng "YYYY-MM-DD" từ server (giờ VN)
    map[row.date] = row.problems_solved;
  });

  const heatmap = document.getElementById("heatmap");
  heatmap.innerHTML = ""; // xoá cell cũ nếu có

  const tooltip = document.createElement("div");
  tooltip.className = "hm-tooltip";
  document.body.appendChild(tooltip);

  const today = new Date();

  // ngày bắt đầu: 180 ngày trước (dùng giờ local)
  const oneYearAgo = new Date();
  oneYearAgo.setDate(oneYearAgo.getDate() - 180);

  // Hàm format ngày local thành "YYYY-MM-DD"
  const toKey = (d) => d.toLocaleDateString("sv-SE"); // ví dụ: 2025-11-17

  // =======================
  // THỐNG KÊ
  // =======================
  let totalAll = 0;
  let totalYear = 0;
  let totalMonth = 0;
  let maxStreak = 0;

  // Tính max streak + tổng
  let tmpStreak = 0;
  for (let d = new Date(oneYearAgo); d <= today; d.setDate(d.getDate() + 1)) {
    const key = toKey(d);
    const solved = map[key] || 0;

    totalAll += solved;

    if (d.getFullYear() === today.getFullYear()) {
      totalYear += solved;
    }

    if (d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear()) {
      totalMonth += solved;
    }

    if (solved > 0) {
      tmpStreak++;
      maxStreak = Math.max(maxStreak, tmpStreak);
    } else {
      tmpStreak = 0;
    }
  }

  // Tính streak hiện tại (từ hôm nay lùi lại)
  let streak = 0;
  let cur = new Date(today);
  while (true) {
    const key = toKey(cur);
    const solved = map[key] || 0;

    if (solved > 0) streak++;
    else break;

    cur.setDate(cur.getDate() - 1);
  }

  // =======================
  // VẼ HEATMAP
  // =======================
  for (let d = new Date(oneYearAgo); d <= today; d.setDate(d.getDate() + 1)) {
    const key = toKey(d);
    const solved = map[key] || 0;

    const cell = document.createElement("div");
    cell.classList.add("hm-cell");

    const level = Math.min(solved, 5);
    cell.classList.add(`hm-${level}`);

    // tooltip
    cell.addEventListener("mouseenter", (ev) => {
      tooltip.innerText = `${key} – ${solved} bài test`;
      tooltip.style.left = ev.pageX + "px";
      tooltip.style.top = ev.pageY + "px";
      tooltip.style.opacity = 1;
    });

    cell.addEventListener("mousemove", (ev) => {
      tooltip.style.left = ev.pageX + "px";
      tooltip.style.top = ev.pageY + "px";
    });

    cell.addEventListener("mouseleave", () => {
      tooltip.style.opacity = 0;
    });

    heatmap.appendChild(cell);
  }

  // =======================
  // CẬP NHẬT TEXT
  // =======================
  document.getElementById("total-all").innerText = totalAll;
  document.getElementById("total-year").innerText = totalYear;
  document.getElementById("total-month").innerText = totalMonth;
  document.getElementById("streak").innerText = streak;
  document.getElementById("max-streak").innerText = maxStreak;

  // ===== MOTIVATE MESSAGE =====
  const todayKey = toKey(today);           // KHÔNG DÙNG toISOString NỮA
  const todaySolved = map[todayKey] || 0;

  let msg = "";
  if (todaySolved === 0) msg = "Mất chuỗi bây giờ Beta!";
  else if (todaySolved < 3) msg = "Tiếp tục làm để trở thành Sigma SAT nào!";
  else if (todaySolved < 5) msg = "Bạn đích thực là SIGMA SAT. Tiếp tục làm để Aura-farming!";
  else msg = "Bạn đang Aura-farming đấy!";

  document.getElementById("motivate").innerText = msg;
}

loadHeatmap();
</script>

<script>
  // Toggle submenu trên sidebar trang chủ
  (function initPracticeMenu() {
    const submenu = document.getElementById("practice-submenu");
    const toggle = document.getElementById("practice-toggle");
    const chevron = toggle?.querySelector(".chevron");

    function setOpen(open) {
      if (!submenu || !toggle) return;
      submenu.classList.toggle("open", open);
      toggle.classList.toggle("active", open);
      if (chevron) chevron.textContent = open ? "⌃" : "⌄";
    }

    if (toggle) {
      toggle.addEventListener("click", () => setOpen(!submenu?.classList.contains("open")));
    }

    setOpen(false);
  })();
</script>

<script>
  async function loadAccountStatus() {
    const el = document.getElementById("account-status");
    if (!el) return;

    const dot = el.querySelector(".status-dot");
    const text = el.querySelector(".status-text");

    const setState = (isPro) => {
      el.classList.toggle("pro", !!isPro);
      if (dot) dot.classList.toggle("pro", !!isPro);
      if (text) text.textContent = isPro ? "Tài khoản Pro" : "Tài khoản thường";
    };

    try {
      const res = await fetch("/api/me");
      if (!res.ok) throw new Error("Session not available");
      const me = await res.json();
      setState(!!me?.isPro);
    } catch (err) {
      if (text) text.textContent = "Không lấy được trạng thái";
      console.error("Không thể lấy trạng thái tài khoản", err);
    }
  }

  loadAccountStatus();
</script>

  <!-- ▲▲▲ HEATMAP JS END ▲▲▲ -->

</body>
</html>
