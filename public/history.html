<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="history.css" />
</head>

<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <a href="index.html" class="sigma-logo-top">SigmaSAT</a>

    <nav class="sidebar-nav">
      <a href="index.html" class="sidebar-item"><img src="/images/home.png" class="sidebar-icon" alt="home"> Trang chủ</a>
      <div class="sidebar-item collapsible" id="practice-toggle">
        <span><img src="/images/luyende.png" class="sidebar-icon" alt="luyende"> Luyện đề</span>
        <span class="chevron"><img src="/images/down.png" class="sidebar-chevron" alt="open"></span>
      </div>
      <div class="sidebar-submenu" id="practice-submenu">
        <a
          href="practice.html?category=real_tests"
          class="sidebar-subitem"
          data-category="real_tests"
        >Đề thi thật</a>
        <a
          href="practice.html?category=practice_tests"
          class="sidebar-subitem"
          data-category="practice_tests"
        >Đề luyện</a>
      </div>
      
    </nav>

    <div class="sidebar-footer">
      <div class="account-status" id="account-status">
        <span class="status-dot"></span>
        <span class="status-text">Đang tải trạng thái…</span>
      </div>
      <a href="/logout" class="logout-bottom">Đăng xuất</a>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <h1 class="page-title" id="test-title">Loading...</h1>
    <div id="history-box" class="history-card">
      Loading...
    </div>

    <button id="back-btn" class="btn back-btn">← Back</button>
  </div>

<script>
  // Lấy file test
  const params = new URLSearchParams(window.location.search);
  const file = params.get("file");
  const categoryFromFile = file?.split("/")[0];

  async function loadHistory() {
    const box = document.getElementById("history-box");

    if (!file) {
      box.innerHTML = '<div class="history-empty">Missing file parameter.</div>';
      return;
    }

    try {
      const res = await fetch(`/api/test-history?file=${encodeURIComponent(file)}`, {
        method: "GET",
        credentials: "same-origin",
      });

      const contentType = res.headers.get("content-type") || "";
      if (!contentType.includes("application/json")) {
        box.innerHTML = '<div class="history-empty">Please login again.</div>';
        return;
      }

      if (!res.ok) {
        box.innerHTML = `<div class="history-empty">Error loading history</div>`;
        return;
      }

      const data = await res.json();
      const history = data.history || [];

      if (history.length === 0) {
        box.innerHTML = '<div class="history-empty">No history yet.</div>';
        return;
      }

      box.innerHTML = "";

      history.forEach(entry => {
        const row = document.createElement("div");
        row.className = "history-row";

        const timeText = new Date(entry.taken_at).toLocaleString("vi-VN");

        row.innerHTML = `
          <div class="history-info">
            <div class="history-time">${timeText}</div>
            <div class="history-score">Score: <b>${entry.score}</b> / ${entry.total_questions}</div>
          </div>

          <button class="btn review-btn">Review</button>
        `;

        row.querySelector(".review-btn").onclick = () => {
          window.location.href =
            `past_exam.html?attempt=${encodeURIComponent(entry.id)}&file=${encodeURIComponent(file)}`;
        };

        box.appendChild(row);
      });

    } catch (err) {
      box.innerHTML = '<div class="history-empty">Error loading history</div>';
    }
  }

  // Back button
  document.getElementById("back-btn").onclick = () => {
    const backUrl = categoryFromFile
      ? `practice.html?category=${encodeURIComponent(categoryFromFile)}`
      : "practice.html";
    window.location.href = backUrl;
  };
  // Set page title = tên test
if (file) {
  // Hiển thị tên test không kèm tiền tố thư mục (ví dụ: real_tests/ hoặc practice_tests/)
  const raw = decodeURIComponent(file);
  const display = String(raw).replace(/^(?:real_tests|practice_tests)\/+/, "");
  document.getElementById("test-title").textContent = display;
} else {
  document.getElementById("test-title").textContent = "Test";
}
  // Load history on page load
  loadHistory();

  (function initPracticeMenu() {
    const submenu = document.getElementById("practice-submenu");
    const toggle = document.getElementById("practice-toggle");
    const chevron = toggle?.querySelector(".chevron");

    function setOpen(open) {
      if (!submenu || !toggle) return;
      submenu.classList.toggle("open", open);
      toggle.classList.toggle("active", open);
      if (chevron) {
        const img = chevron.querySelector('img');
        if (img) img.src = open ? '/images/up.png' : '/images/down.png';
      }
    }

    if (toggle) {
      toggle.addEventListener("click", () => setOpen(!submenu?.classList.contains("open")));
    }

    setOpen(true);
    if (categoryFromFile) {
      document
        .querySelectorAll(`.sidebar-subitem[data-category="${categoryFromFile}"]`)
        .forEach((item) => item.classList.add("active"));
    }
  })();
</script>

<script>
  async function loadAccountStatus() {
    const el = document.getElementById("account-status");
    if (!el) return;

    const dot = el.querySelector(".status-dot");
    const text = el.querySelector(".status-text");

    const setState = (isPro) => {
      el.classList.toggle("pro", !!isPro);
      if (dot) dot.classList.toggle("pro", !!isPro);
      if (text) text.textContent = isPro ? "Tài khoản Pro" : "Tài khoản thường";
    };

    try {
      const res = await fetch("/api/me");
      if (!res.ok) throw new Error("Session not available");
      const me = await res.json();
      setState(!!me?.isPro);
    } catch (err) {
      if (text) text.textContent = "Không lấy được trạng thái";
      console.error("Không thể lấy trạng thái tài khoản", err);
    }
  }

  loadAccountStatus();
</script>

</body>
</html>
